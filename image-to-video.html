
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Video | AEVOR AI</title>
        <link rel="icon" href="logo.jpg">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101114;
            color: white;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            text-align: center;
            background: #191a1f;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        h1 {
            color: gold;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        /* Upload Area */
        .upload-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 190px;
            border: 2px dashed #8c7835;
            padding: 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 25px;
        }

        .upload-box:hover {
            background: #25241e;
            border-color: gold;
        }

        .upload-icon {
            font-size: 40px;
            color: gold;
            margin-bottom: 12px;
        }

        .upload-box h3 {
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #999;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Prompt */
        .prompt-label {
            display: block;
            text-align: left;
            margin-bottom: 10px;
            color: gold;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            background: #101114;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 15px;
            margin-bottom: 20px;
        }

        textarea:focus {
            border-color: gold;
        }

        textarea::placeholder {
            color: #777;
        }

        /* Button */
        button {
            background: gold;
            color: black;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: white;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                margin: 25px auto;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Image to Video</h1>

        <p class="subtitle">
            Turn your images into AI-generated videos.
        </p>

        <label for="imageUpload" class="upload-box">

            <div class="upload-icon">＋</div>

            <h3>Upload Your Image</h3>

            <p>Click to browse JPG or PNG images</p>

            <img id="preview" alt="Selected image preview">

        </label>

        <input
            type="file"
            id="imageUpload"
            accept="image/png,image/jpeg"
        >

        <label for="videoPrompt" class="prompt-label">
            Enter Your Video Prompt
        </label>

        <textarea
            id="videoPrompt"
            rows="4"
            placeholder="Describe how you want your image to move..."
        ></textarea>

        <button id="generateBtn" type="button">
            Generate Video
        </button>

    </div>

<script>
    const imageUpload = document.getElementById("imageUpload");
    const preview = document.getElementById("preview");
    const generateBtn = document.getElementById("generateBtn");

    let previousImageURL = null;
    let uploadedFilePath = null;

    imageUpload.addEventListener("change", function () {
        const file = this.files[0];

        uploadedFilePath = null;

        if (!file) return;

        if (!["image/jpeg", "image/png"].includes(file.type)) {
            alert("Please select a JPG or PNG image.");
            this.value = "";
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            alert("Image size must be less than 10 MB.");
            this.value = "";
            return;
        }

        if (previousImageURL) {
            URL.revokeObjectURL(previousImageURL);
        }

        previousImageURL = URL.createObjectURL(file);

        preview.src = previousImageURL;
        preview.style.display = "block";
    });

    generateBtn.addEventListener("click", async function () {
        const file = imageUpload.files[0];

        if (!file) {
            alert("Please select an image first.");
            return;
        }

        const formData = new FormData();
        formData.append("image", file);

        generateBtn.disabled = true;
        generateBtn.textContent = "Uploading Image...";

        try {
            const response = await fetch("/api/upload-image", {
                method: "POST",
                body: formData
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Image upload failed.");
            }

            uploadedFilePath = result.filePath;

            generateBtn.textContent = "Image Uploaded ✓";

            alert("Image uploaded successfully! Next step: video generation.");

            console.log("Uploaded file path:", uploadedFilePath);

        } catch (error) {
            console.error("Upload error:", error);

            generateBtn.textContent = "Upload Failed";
            alert(error.message);

        } finally {
            generateBtn.disabled = false;
        }
    });
</script>

</body>
</html>
